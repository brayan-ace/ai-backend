name: nexa_smart_ai
description: "Nexa Smart AI - An intelligent Flutter chat application powered by Gemini AI."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  shared_preferences: ^2.1.0
  provider: ^6.1.1
  http: ^1.1.0
  flutter_markdown: ^0.6.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.0.1
  flutter_math_fork: ^0.7.2
  markdown: ^7.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  intl: 0.20.2
  image: ^4.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  font_awesome_flutter: ^10.12.0
  flutter_tts: ^4.2.5
  record: ^6.2.0
  path_provider: ^2.1.1
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - "assets/images/app_icon.jpg"
    - assets/locales/
